<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Users</title>
</head>
<body>
     <h1>Edit User</h1>

     <form method="POST">

         <label>Title</label>
         <input type="text" name="title" value="{{product.title}}"><br><br>

     </form>

     <a href="{{url_for('show_products')}}">Back</a>

</body>
